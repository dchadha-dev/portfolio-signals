[build]
  publish = "."
  functions = "netlify/functions"

# Netlify Blobs needs this package available to the functions bundle.
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

# Scheduled warm-up so the cached snapshot is fresh before the
# 7:00 and 20:30 Bangkok (UTC+7) checks — i.e. 23:30 and 13:00 UTC.
[functions."trigger_refresh"]
  schedule = "30 23,12 * * *"

# Do not fingerprint or cache the shell — data comes from functions/GitHub.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "all"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
