[build]
  publish = "."
  functions = "netlify/functions"
  # Only rebuild when the site itself changes. Scanner data commits
  # (signals_payload.json, live_prices.json) no longer burn build credits.
  ignore = "git diff --quiet HEAD^ HEAD -- index.html netlify/ netlify.toml package.json robots.txt _headers"

[build.environment]
  # requirements.txt in the repo root makes Netlify install Python deps.
  # Those are for the GitHub Actions scanner, not this site, but the install
  # still runs — so pin a version where prebuilt pandas wheels exist.
  # (3.14 has none, which is what broke the build.)
  PYTHON_VERSION = "3.12"

# Warm the cached snapshot ~15 min after each scanner run so the endpoint
# is always fresh before you check it. UTC — see daily_scanner.yml for the
# market-open reasoning.
[functions."trigger_refresh"]
  schedule = "36 13 * * 1-5"  # 20:36 BKK — just after the scanner run

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "all"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
