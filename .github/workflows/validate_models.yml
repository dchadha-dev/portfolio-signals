name: Monthly Model Validation

on:
  schedule:
    # First Monday of the month. Cron ORs day-of-month with day-of-week, so
    # '0 19 1-7 * 1' ran on days 1-7 AND every Monday (~11 runs a month).
    # Schedule days 1-7 and let the guard step keep only the Monday.
    - cron: '0 19 1-7 * *'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Only run on the first Monday (scheduled runs)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements-github-actions.txt scipy

      - name: Run model validation
        if: steps.gate.outputs.run == 'true'
        run: python signal_scanner_validation.py

      - name: Commit validated_params.json
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "Validation Bot"
          git config user.email "bot@portfolio-signals"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add validated_params.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: monthly validation update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
